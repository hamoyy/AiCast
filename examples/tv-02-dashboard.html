<!doctype html>
<!-- 投屏测试 TV-02：横向数据大屏（电视 960x540dp 横屏专用形态）
     Chromium 66 基线：不用 clamp/gap/inset；两列用 float + 百分比；数字全部 tabular-nums 对齐。
     含实时时钟（每秒）、内联 SVG 折线+柱状、三行 KPI —— 验证这类"常驻看板"能否长时间稳定挂着。
     回传：demo.dash -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>家庭网络看板</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:#070A11; color:#E7ECF7; overflow:hidden;
    font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  }
  .wrap { position:relative; width:100%; height:100%; padding:26px 34px; }

  /* 顶栏：标题左、时钟右 */
  .top { height:52px; border-bottom:1px solid #1B2434; margin-bottom:18px; }
  .brand { float:left; font-size:23px; font-weight:750; letter-spacing:-.01em; }
  .brand span { display:block; font-size:13px; color:#6C7B96; font-weight:400; margin-top:4px; letter-spacing:.06em; }
  .clock { float:right; text-align:right; }
  .clock b { font-size:38px; font-weight:800; line-height:1; letter-spacing:-.02em; }
  .clock i { display:block; font-style:normal; font-size:13px; color:#6C7B96; margin-top:5px; }

  /* 主区：左图 66%，右 KPI 32% —— 用 float，不用 gap */
  .main { position:absolute; top:96px; left:34px; right:34px; bottom:26px; }
  .left { float:left; width:66%; height:100%; }
  /* 右栏改 flex 纵向均分：固定 px 相加在 540 高的屏上会溢出被 overflow:hidden 静默裁掉
     （实测溢出 252px），改成 flex:1 后两块面板自适应剩余空间。66 支持 flex ✔ */
  .right { float:right; width:32%; height:100%; display:flex; flex-direction:column; }
  .right .panel { flex:1 1 0; min-height:0; margin-bottom:14px; overflow:hidden; }
  .right .panel:last-child { margin-bottom:0; }

  .panel { background:#0F1524; border:1px solid #1E283C; border-radius:14px;
           padding:14px 16px; margin-bottom:14px; overflow:hidden; }
  .ph { font-size:14px; color:#8996AE; margin-bottom:10px; letter-spacing:.05em; }
  .ph em { font-style:normal; float:right; color:#5E6B82; }

  /* KPI 行：上下堆叠，用 margin 拉开间距（66 不认 gap） */
  .kpi { position:relative; padding:9px 0 9px 16px; }
  .kpi + .kpi { border-top:1px solid #1B2434; }
  .kpi b { display:block; font-size:12px; color:#6C7B96; font-weight:500; letter-spacing:.05em; }
  .kpi strong { display:block; font-size:34px; font-weight:800; line-height:1.15; margin-top:1px; }
  .kpi strong i { font-size:16px; font-style:normal; color:#6C7B96; font-weight:500; margin-left:4px; }
  .kpi:before { content:''; position:absolute; left:0; top:18px; bottom:18px; width:3px; border-radius:3px; background:#3FD9AE; }
  .kpi.c2:before { background:#4C8DFF; } .kpi.c3:before { background:#FFB84C; }
  .up { color:#3FD9AE; font-size:12px; } .down { color:#FF7A7A; font-size:12px; }

  svg { display:block; width:100%; height:auto; }
  .g  { fill:none; stroke:#4C8DFF; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .g2 { fill:none; stroke:#3FD9AE; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .lb { font-size:9.5px; fill:#6C7B96; }
  .grid { stroke:#1B2434; stroke-width:1; }

  .foot { position:absolute; bottom:0; left:0; right:0; font-size:12px; color:#4E5A70; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">家庭网络看板<span>每 60s 刷新 · 数据为演示值</span></div>
      <div class="clock"><b id="t">--:--:--</b><i id="d">----</i></div>
    </div>

    <div class="main">
      <div class="left">
        <div class="panel" style="height:232px">
          <div class="ph">下行带宽 <em>近 12 小时 · Mbps</em></div>
          <svg viewBox="0 0 620 150" preserveAspectRatio="none">
            <g class="grid">
              <line x1="0" y1="30" x2="620" y2="30"/><line x1="0" y1="62" x2="620" y2="62"/>
              <line x1="0" y1="94" x2="620" y2="94"/><line x1="0" y1="126" x2="620" y2="126"/>
            </g>
            <polygon points="0,110 56,88 112,96 168,64 224,72 280,44 336,58 392,36 448,52 504,30 560,42 620,26 620,150 0,150"
                     fill="url(#ag)"/>
            <polyline class="g" points="0,110 56,88 112,96 168,64 224,72 280,44 336,58 392,36 448,52 504,30 560,42 620,26"/>
            <circle cx="620" cy="26" r="4" fill="#fff"/><circle cx="620" cy="26" r="7" fill="none" stroke="#4C8DFF" stroke-width="2"/>
            <defs>
              <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4C8DFF" stop-opacity=".30"/>
                <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <g class="lb"><text x="0" y="14">300</text><text x="0" y="142">0</text></g>
          </svg>
        </div>
        <div class="panel" style="height:150px">
          <div class="ph">三台设备在线时长 <em>小时</em></div>
          <svg viewBox="0 0 620 96" preserveAspectRatio="none">
            <g class="grid"><line x1="0" y1="80" x2="620" y2="80"/></g>
            <rect x="10"  y="18" width="42" height="62" fill="#4C8DFF" opacity=".85" rx="4"/>
            <rect x="106" y="34" width="42" height="46" fill="#3FD9AE" opacity=".85" rx="4"/>
            <rect x="202" y="50" width="42" height="30" fill="#FFB84C" opacity=".85" rx="4"/>
            <rect x="298" y="8"  width="42" height="72" fill="#4C8DFF" opacity=".85" rx="4"/>
            <rect x="394" y="42" width="42" height="38" fill="#3FD9AE" opacity=".85" rx="4"/>
            <rect x="490" y="60" width="42" height="20" fill="#FFB84C" opacity=".85" rx="4"/>
            <g class="lb">
              <text x="20" y="95">电视</text><text x="116" y="95">手机</text><text x="212" y="95">平板</text>
              <text x="308" y="95">笔记本</text><text x="402" y="95">音箱</text><text x="498" y="95">其他</text>
            </g>
          </svg>
        </div>
      </div>

      <div class="right">
        <div class="panel">
          <div class="kpi"><b>当前下行</b><strong>286<i>Mbps</i></strong><span class="up">▲ 12%</span></div>
          <div class="kpi c2"><b>在线设备</b><strong>6<i>台</i></strong></div>
          <div class="kpi c3"><b>今日流量</b><strong>18.4<i>GB</i></strong><span class="down">▼ 3%</span></div>
        </div>
        <div class="panel" style="height:246px">
          <div class="ph">链路状态 <em>实时</em></div>
          <div class="kpi" style="padding-top:6px"><b>主路由</b><strong style="font-size:22px">正常</strong></div>
          <div class="kpi c2"><b>光猫</b><strong style="font-size:22px">正常</strong></div>
          <div class="kpi c3"><b>旁路由</b><strong style="font-size:22px">延迟偏高</strong></div>
          <div class="kpi"><b>丢包率</b><strong style="font-size:22px">0.02%</strong></div>
        </div>
      </div>

      <div class="foot">演示数据 · 实时时钟每秒由 JS 驱动，用于确认页面没卡死</div>
    </div>
  </div>

<script>
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var n = new Date();
    document.getElementById('t').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
    var w = ['周日','周一','周二','周三','周四','周五','周六'][n.getDay()];
    document.getElementById('d').textContent =
      n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()) + ' ' + w;
  }
  tick();
  setInterval(tick, 1000);

  if (typeof Aiface !== 'undefined' && Aiface.emit) {
    Aiface.emit('demo.dash', { kind: 'home-network', mounted: true });
  }

  // 布局自检：电视 WebView 在脚本首次执行时 innerWidth 可能是 0
  //（实测 Chromium 66 首帧未布局完），延迟一拍再量，把真实渲染结果回传给 agent 侧核对。
  function rect(el) {
    var r = el.getBoundingClientRect();
    return Math.round(r.width) + 'x' + Math.round(r.height) + '@' + Math.round(r.left) + ',' + Math.round(r.top);
  }
  setTimeout(function () {
    var info = {
      probeAt: 'setTimeout 1200ms',
      inner: window.innerWidth + 'x' + window.innerHeight,
      client: document.documentElement.clientWidth + 'x' + document.documentElement.clientHeight,
      body: rect(document.body),
      left: rect(document.querySelector('.left')),
      right: rect(document.querySelector('.right')),
      svg1: rect(document.querySelector('.panel svg')),
      clock: document.getElementById('t').textContent,
      overflowX: document.documentElement.scrollWidth - document.documentElement.clientWidth,
      overflowY: document.documentElement.scrollHeight - document.documentElement.clientHeight
    };
    if (typeof Aiface !== 'undefined' && Aiface.emit) Aiface.emit('demo.layout', info);
  }, 1200);
</script>
</body>
</html>
