<!doctype html>
<!-- 投屏测试 TV-01：遥控轮播简报（小米电视 MiTV-MFTP0 · 1920x1080 · Chromium 66）
     CSS 兼容基线 Chromium 66：全程不用 clamp()/min()/max()、不用 flex/grid gap、不用 inset、
     不用 env(safe-area-inset) —— 这些在 66 上会被静默丢弃，页面会塌成左上角一小坨。
     代替方案：固定 px + margin 代 gap + top/right/bottom/left 代 inset。
     交互：← → 翻页 / OK·确认键 暂停继续；自动播放 5.5s 一页。
     回传：demo.slide / demo.pause / demo.resume -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>家庭晚间播报</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:#080B12; color:#E9EEF8; overflow:hidden;
    font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage { position:relative; width:100%; height:100%; }

  .bar { position:absolute; top:0; left:0; height:4px; width:0; z-index:9;
         background:linear-gradient(90deg,#245C4C,#3FD9AE); }
  .bar.run { animation:grow linear forwards; }
  @keyframes grow { from{width:0} to{width:100%} }

  .slide { position:absolute; top:0; right:0; bottom:0; left:0;
           padding:52px 64px; opacity:0; transition:opacity .55s ease; }
  .slide.on { opacity:1; }
  .s1 { background:radial-gradient(1100px 620px at 78% -12%, #123041 0%, #080B12 58%); }
  .s2 { background:radial-gradient(1100px 620px at 12% 108%, #2A1C3E 0%, #080B12 58%); }
  .s3 { background:radial-gradient(1100px 620px at 88% 106%, #3A2A12 0%, #080B12 58%); }
  .s4 { background:radial-gradient(1100px 620px at 30% -8%,  #102F35 0%, #080B12 58%); }

  .kicker { font-size:19px; letter-spacing:.3em; color:#3FD9AE; margin-bottom:20px; }
  .kicker.k2 { color:#B79BFF; } .kicker.k3 { color:#FFC24C; } .kicker.k4 { color:#4CC9E0; }

  h2 { font-size:64px; line-height:1.12; font-weight:800; letter-spacing:-.01em; margin-bottom:22px; }
  .body { font-size:27px; line-height:1.66; color:#A9B4C6; max-width:760px; }
  .big  { font-size:150px; font-weight:900; line-height:1; color:#3FD9AE; letter-spacing:-.03em; }
  .big.b3 { color:#FFC24C; } .big.b4 { color:#4CC9E0; }

  .split { display:table; width:100%; }
  .split > div { display:table-cell; vertical-align:middle; }
  .split .r { text-align:right; width:38%; }

  .dots { position:absolute; bottom:78px; left:64px; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%;
         background:#2B3444; margin-right:12px; transition:all .3s; }
  .dot.on { background:#3FD9AE; width:34px; border-radius:6px; }

  .help { position:absolute; bottom:40px; left:64px; font-size:17px; color:#5E6B82; letter-spacing:.06em; }
  .help b { color:#93A0B8; font-weight:600; }
  .num  { position:absolute; bottom:40px; right:64px; font-size:17px; color:#5E6B82; }

  .paused { position:absolute; bottom:74px; right:64px; font-size:17px; color:#FFB84C;
            border:1px solid rgba(255,184,76,.45); background:rgba(255,184,76,.1);
            padding:7px 16px; border-radius:99px; display:none; }
  body.paused .paused { display:block; }
  body.paused .bar { animation-play-state:paused; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="bar" id="bar"></div>

    <div class="slide s1">
      <div class="split">
        <div>
          <div class="kicker">19:40 · 今日回顾</div>
          <h2>今天过得还不错</h2>
          <div class="body">待办完成 7 项，专注时长 4 小时 20 分。下午那场评审比预期早结束半小时，多出来的时间用在了排障上。</div>
        </div>
        <div class="r"><div class="big">7<i style="font-size:52px;font-style:normal;color:#7B8CA3">/9</i></div></div>
      </div>
    </div>

    <div class="slide s2">
      <div class="split">
        <div>
          <div class="kicker k2">20:30 · 待办提醒</div>
          <h2>还有两件事没做完</h2>
          <div class="body">① 给绿萝浇水，上次是四天前；② 确认明天上午的会议室预约，系统还没回执。</div>
        </div>
        <div class="r"><div class="big" style="color:#B79BFF">2</div></div>
      </div>
    </div>

    <div class="slide s3">
      <div class="split">
        <div>
          <div class="kicker k3">21:00 · 天气</div>
          <h2>明天降温，记得加件外套</h2>
          <div class="body">白天最高 18°，比今天低 7 度，早高峰有轻雾，出门前看一眼实时路况。</div>
        </div>
        <div class="r"><div class="big b3">18°</div></div>
      </div>
    </div>

    <div class="slide s4">
      <div class="split">
        <div>
          <div class="kicker k4">21:30 · 放松时间</div>
          <h2>今天就到这儿吧</h2>
          <div class="body">睡前把手机放远一点，明早 7 点我会准时叫你。晚安。</div>
        </div>
        <div class="r"><div class="big b4">晚安</div></div>
      </div>
    </div>

    <div class="dots" id="dots"></div>
    <div class="help"><b>← →</b> 翻页　·　<b>OK</b> 暂停 / 继续</div>
    <div class="num" id="num"></div>
    <div class="paused">已暂停</div>
  </div>

<script>
  var DUR = 5500, idx = -1, timer = null, paused = false;
  var slides = document.querySelectorAll('.slide');
  var dotsBox = document.getElementById('dots');
  var bar = document.getElementById('bar');

  for (var i = 0; i < slides.length; i++) {
    var d = document.createElement('span');
    d.className = 'dot';
    dotsBox.appendChild(d);
  }
  var dots = dotsBox.children;

  function emit(n, data) {
    if (typeof AiCast !== 'undefined' && AiCast.emit) AiCast.emit(n, data || {});
  }

  function tick() {
    bar.classList.remove('run');
    void bar.offsetWidth;           // 强制重排，重启动画
    bar.style.animationDuration = DUR + 'ms';
    bar.classList.add('run');
    timer = setTimeout(function () { go(1, 'auto'); }, DUR);
  }

  function go(step, by) {
    if (timer) { clearTimeout(timer); timer = null; }
    idx = (idx + step + slides.length) % slides.length;
    for (var i = 0; i < slides.length; i++) slides[i].classList.toggle('on', i === idx);
    for (var j = 0; j < dots.length; j++) dots[j].className = (j === idx ? 'dot on' : 'dot');
    document.getElementById('num').textContent = (idx + 1) + ' / ' + slides.length;
    emit('demo.slide', { index: idx, total: slides.length, by: by || 'nav' });
    if (!paused) tick();
  }

  function setPause(p) {
    paused = p;
    document.body.className = p ? 'paused' : '';
    emit(p ? 'demo.pause' : 'demo.resume', { index: idx });
    if (p) { if (timer) { clearTimeout(timer); timer = null; } }
    else tick();
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (k === 39 || k === 22) { go(1, 'nav'); }            // → / DPAD_RIGHT
    else if (k === 37 || k === 21) { go(-1, 'nav'); }      // ← / DPAD_LEFT
    else if (k === 13 || k === 23 || k === 66) {           // Enter / DPAD_CENTER
      setPause(!paused); e.preventDefault();
    }
  });

  go(1, 'auto');
  emit('demo.ready', { slides: slides.length, webview: 'chromium66-target' });
</script>
</body>
</html>
