<!doctype html>
<!-- 双端演示 · 手机端（touch 形态）
     意图：「今晚吃什么」家庭投票。手机负责"输入"（点选），电视负责"展示"（票情大屏）。
     联动：本页点了票 → emit vote.cast → agent 收到后向电视 POST /message → 电视票数+1。
     手机 WebView ≥110，可放心用 clamp/gap/现代 CSS；电视端要按 Chromium 66 基线另写一份。
     回传：vote.cast / vote.ready
     下行：{"action":"tally","list":[{"id":"hotpot","count":2}, ...]} / {"action":"reset"} -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今晚吃什么</title>
<style>
  :root{
    color-scheme:light;
    --bg:#F7F5F2; --card:#FFF; --ink:#201A16; --sub:#8B7F74;
    --line:#ECE5DC; --brand:#D2662F; --ok:#3F8A5B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;
    padding:16px;
    padding-top:max(16px, calc(env(safe-area-inset-top,0px) + 6px));
    padding-bottom:max(16px, calc(env(safe-area-inset-bottom,0px) + 6px));
  }
  .top{margin:6px 2px 18px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .sub{font-size:12.5px;color:var(--sub);margin-top:5px}
  .sub b{color:var(--brand);font-variant-numeric:tabular-nums}

  .list{display:flex;flex-direction:column;gap:10px}
  .card{
    position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;
    padding:14px 15px;overflow:hidden;display:flex;align-items:center;gap:13px;
    min-height:74px;transition:border-color .22s, transform .12s, box-shadow .22s;
    box-shadow:0 3px 10px -8px rgba(32,26,22,.3);
  }
  .card:active{transform:scale(.985)}
  .card.mine{border-color:var(--brand);box-shadow:0 6px 18px -10px rgba(210,102,47,.6)}
  .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#CCC)}
  .avatar{
    width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--c,#CCC);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:800;
    margin-left:4px;
  }
  .mid{flex:1;min-width:0}
  .nm{font-size:16px;font-weight:700;line-height:1.25}
  .ds{font-size:11.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track{height:5px;border-radius:99px;background:#F0E9E1;margin-top:8px;overflow:hidden}
  .fill{height:100%;border-radius:99px;background:var(--c,#CCC);width:0;transition:width .5s cubic-bezier(.3,.9,.3,1)}
  .rt{text-align:right;flex:0 0 auto}
  .cnt{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .cnt em{font-size:11px;font-style:normal;font-weight:500;color:var(--sub);margin-left:2px}
  .tagmine{font-size:10px;color:var(--brand);margin-top:4px;visibility:hidden}
  .card.mine .tagmine{visibility:visible}

  .foot{margin-top:18px;padding:13px 15px;border-radius:14px;background:#201A16;color:#F3EBE3}
  .foot p{font-size:13px;line-height:1.55}
  .foot p b{color:#FFB489;font-weight:700}

  .live{margin-top:12px;font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:7px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--ok);
          box-shadow:0 0 0 3px rgba(63,138,91,.15);font-style:normal}
</style>
</head>
<body>
  <div class="top">
    <h1>今晚吃什么</h1>
    <div class="sub">全家投票 · 已投 <b id="voted">3</b> / 4 人</div>
  </div>

  <div class="list" id="list"></div>

  <div class="foot">
    <p id="footTx">还没选？你这一票会实时同步到<b>客厅电视</b>。</p>
  </div>
  <div class="live"><i></i><span id="liveTx">等待投票…</span></div>

<script>
  var OPTIONS = [
    {id:'hotpot',   n:'火锅',    d:'天冷就得吃点热乎的，但回来一身味儿', c:'#D9534F', count:1},
    {id:'homedish', n:'家常菜',  d:'冰箱里还有菜，30 分钟能上桌',         c:'#4C8D5B', count:1},
    {id:'japanese', n:'日料',    d:'楼下那家周三有套餐，稍微贵一点',      c:'#4C8DFF', count:1},
    {id:'noodle',   n:'煮碗面',  d:'最快最省事，10 分钟解决战斗',          c:'#FFB84C', count:0},
    {id:'takeout',  n:'点外卖',  d:'不想动，谁投票谁下去拿',              c:'#9B7BFF', count:0}
  ];
  var mine = null;
  var list = document.getElementById('list');

  function emit(n, d){ if (typeof Aiface !== 'undefined' && Aiface.emit) Aiface.emit(n, d || {}); }

  function maxCount(){
    return OPTIONS.reduce(function(m, o){ return Math.max(m, o.count); }, 0) || 1;
  }

  function render(){
    var mx = maxCount(), total = 0;
    OPTIONS.forEach(function(o){ total += o.count; });
    document.getElementById('voted').textContent = String(total);

    list.innerHTML = OPTIONS.map(function(o){
      var w = Math.round(o.count / mx * 100);
      return '<div class="card' + (mine === o.id ? ' mine' : '') + '" data-id="' + o.id + '" style="--c:' + o.c + '">' +
        '<div class="stripe"></div>' +
        '<div class="avatar">' + o.n.charAt(0) + '</div>' +
        '<div class="mid">' +
          '<div class="nm">' + o.n + '</div>' +
          '<div class="ds">' + o.d + '</div>' +
          '<div class="track"><div class="fill" style="width:' + w + '%"></div></div>' +
        '</div>' +
        '<div class="rt"><div class="cnt">' + o.count + '<em>票</em></div>' +
        '<div class="tagmine">我投的</div></div>' +
      '</div>';
    }).join('');

    var who = null;
    if (mine) who = OPTIONS.filter(function(o){ return o.id === mine; })[0];
    document.getElementById('footTx').innerHTML = who
      ? '你投了 <b>' + who.n + '</b>，票数已同步到客厅电视。'
      : '还没选？你这一票会实时同步到<b>客厅电视</b>。';
  }

  list.addEventListener('click', function(e){
    var el = e.target.closest('.card');
    if (!el) return;
    var id = el.getAttribute('data-id');
    var prev = mine;
    if (prev === id) return;                       // 重复点同一项不改票
    var add = OPTIONS.filter(function(o){ return o.id === id; })[0];
    var sub = prev ? OPTIONS.filter(function(o){ return o.id === prev; })[0] : null;
    if (sub) sub.count = Math.max(0, sub.count - 1);
    add.count += 1;
    mine = id;
    render();
    document.getElementById('liveTx').textContent =
      '已发送：' + add.n + ' +1' + (sub ? '、' + sub.n + ' −1' : '') + ' → 电视';
    emit('vote.cast', { id:add.id, name:add.n, count:add.count, prev:sub ? sub.id : null });
  });

  if (typeof Aiface !== 'undefined' && Aiface.onMessage) {
    Aiface.onMessage(function(m){
      if (!m) return;
      if (m.action === 'tally' && m.list) {
        m.list.forEach(function(u){
          var t = OPTIONS.filter(function(o){ return o.id === u.id; })[0];
          if (t) t.count = u.count;
        });
        render();
        document.getElementById('liveTx').textContent = '已收到电视端汇总';
      } else if (m.action === 'reset') {
        OPTIONS.forEach(function(o){ o.count = 0; });
        mine = null; render();
      }
    });
  }

  render();
  emit('vote.ready', { options: OPTIONS.length });

  // 布局自检：把每张卡片的中心点连同溢出量回传，agent 侧据此精确模拟点按
  // （本机 dpr 2.75，adb input tap 要用物理像素 = CSS 坐标 × dpr）
  setTimeout(function () {
    if (typeof Aiface === 'undefined' || !Aiface.emit) return;
    var taps = {};
    var cards = document.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      taps[cards[i].getAttribute('data-id')] = {
        cx: Math.round(r.left + r.width / 2),
        cy: Math.round(r.top + r.height / 2),
        w: Math.round(r.width), h: Math.round(r.height)
      };
    }
    emit('vote.layout', {
      dpr: window.devicePixelRatio || 1,
      viewport: window.innerWidth + 'x' + window.innerHeight,
      overflowY: document.documentElement.scrollHeight - document.documentElement.clientHeight,
      taps: taps
    });
  }, 1200);
</script>
</body>
</html>
