<!doctype html>
<!-- M1 验收演示：投这张卡片，点按钮回传事件（agent 用 GET /events 拉取） -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0B0E12; color:#E6EAF0; font-family:system-ui,-apple-system,sans-serif; }
  .card { width:min(92vw,420px); background:#141A21; border:1px solid #232C36;
          border-radius:20px; padding:28px; box-shadow:0 10px 40px #0006; }
  h1 { margin:0 0 6px; font-size:clamp(22px,6vw,30px); }
  p  { margin:0 0 22px; color:#8A939E; font-size:clamp(14px,4vw,17px); }
  .row { display:flex; gap:12px; }
  button { flex:1; padding:14px 0; font-size:17px; border:0; border-radius:12px; cursor:pointer; }
  .ok { background:#4CC2A5; color:#0B0E12; }
  .no { background:#232C36; color:#E6EAF0; }
  #log { margin-top:16px; min-height:22px; color:#4CC2A5; font-size:14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>aicast 投送成功 ✅</h1>
    <p>这是 M1 验收演示页。点按钮会通过 JS SDK 回传事件，agent 拉 /events 可见。</p>
    <div class="row">
      <button class="ok" onclick="tap('approve')">同意</button>
      <button class="no" onclick="tap('reject')">拒绝</button>
    </div>
    <div id="log"></div>
  </div>
<script>
  function tap(kind){
    AiCast.emit(kind, { demo:true, at:Date.now() });
    log('已回传事件: ' + kind);
  }
  AiCast.onMessage(d => log('收到增量消息: ' + JSON.stringify(d)));
  async function info(){ const i = await AiCast.getInfo();
    if(i) log('设备: ' + i.name + ' / ' + i.device.class + ' / touch=' + i.device.input.touch); }
  function log(t){ document.getElementById('log').textContent = t; }
  info();
</script>
</body>
</html>
