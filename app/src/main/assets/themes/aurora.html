<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Aurora</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #070b12; color: #eaf1f7;
    overflow: hidden;            /* 文档本身不产生滚动区 */
    overscroll-behavior: none;   /* 禁掉过扫回弹 */
    touch-action: none;          /* 手势不再被解释成滚动/平移 */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-user-drag: none;
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* 整屏固定盒：把超出视口的光斑裁在盒内，任何元素都撑不出可拖动区域。
     别写 inset —— 电视的 Chromium 66 不支持，整条声明会被丢掉。 */
  .stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(64px); opacity: 0.5; will-change: transform;
  }
  .b1 { width: 62vmax; height: 62vmax; left: -12vmax; top: -16vmax;
        background: radial-gradient(circle at 30% 30%, #38d9c9, transparent 60%);
        animation: drift1 26s ease-in-out infinite alternate; }
  .b2 { width: 56vmax; height: 56vmax; right: -14vmax; top: 4vmax;
        background: radial-gradient(circle at 60% 40%, #5b8def, transparent 62%);
        animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 52vmax; height: 52vmax; left: 22vmax; bottom: -20vmax;
        background: radial-gradient(circle at 50% 50%, #9b6dff, transparent 60%);
        animation: drift3 29s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-16vmax, 10vmax) scale(1.10); } }
  @keyframes drift3 { to { transform: translate(10vmax, -14vmax) scale(1.20); } }
  .wrap {
    position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; padding: 0 6vw; box-sizing: border-box;
  }
  .time { font-size: 24vmin; font-weight: 200; line-height: 1;
          letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .sec { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace;
         font-size: 9vmin; opacity: .55; margin-left: .18em; font-weight: 300; }
  .date { margin-top: 3.5vmin; font-size: 5vmin; font-weight: 300; opacity: .82;
          letter-spacing: .1em; }
  .hint { margin-top: 6vmin; font-size: 2.6vmin; opacity: .35; letter-spacing: .3em; }
</style>
</head>
<body>
  <div class="stage">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="wrap">
    <div class="time"><span id="hm">--:--</span><span class="sec" id="ss">--</span></div>
    <div class="date" id="date">—</div>
    <div class="hint" id="hint">A I C A S T</div>
  </div>
<script>
(function () {
  // 语言由宿主注入（window.__AICAST_LANG__），与 app 命中的那套文案资源一致
  var LANG = (window.__AICAST_LANG__ === 'en') ? 'en' : 'zh';
  var WD = LANG === 'en'
    ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
    : ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
             'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function p(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d) {
    if (LANG === 'en') {
      return WD[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }
    return d.getFullYear() + '年' + p(d.getMonth() + 1) + '月' + p(d.getDate()) + '日 ' + WD[d.getDay()];
  }
  function tick() {
    var d = new Date();
    document.getElementById('hm').textContent = p(d.getHours()) + ':' + p(d.getMinutes());
    document.getElementById('ss').textContent = ':' + p(d.getSeconds());
    document.getElementById('date').textContent = fmtDate(d);
  }
  document.documentElement.lang = LANG;
  document.title = (LANG === 'en') ? 'Aurora' : '极光';
  document.getElementById('hint').textContent =
    'A I C A S T · ' + ((LANG === 'en') ? 'Aurora' : '极光');
  tick(); setInterval(tick, 1000);

  // 双保险：CSS 已经禁掉滚动/手势，但 WebView 在过扫、多指或电视方向键下
  // 仍可能把整页推走（极光之前就是被拖动后位移）。这里直接吞掉手势与拖拽，
  // 并在万一发生滚动时立刻归位。
  function stop(e) { if (e.cancelable) e.preventDefault(); }
  ['touchstart', 'touchmove', 'touchend', 'touchcancel', 'dragstart', 'selectstart']
    .forEach(function (t) { document.addEventListener(t, stop, { passive: false }); });
  window.addEventListener('scroll', function () { window.scrollTo(0, 0); }, { passive: true });
})();
</script>
</body>
</html>
