<!doctype html>
<!-- 可交互待办：勾选即回传事件（agent 经 /events 感知）；支持 /message 增量加项；本地记住勾选
     CSS 兼容基线：老 WebView（Chromium 66，常见于电视）不支持 inset/clamp/min/max/flex-gap，
     全部采用"先回退值、再现代值覆盖"或纯兼容写法。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<style>
  :root { color-scheme: dark; --bg:#0B0E12; --card:#141A21; --line:#232C36; --fg:#E6EAF0; --dim:#8A939E; --ok:#4CC2A5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #16222B 0%, var(--bg) 60%);
         color:var(--fg); font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
         display:flex; align-items:center; justify-content:center; padding:16px; padding-top:16px;
         padding-top:max(16px, calc(env(safe-area-inset-top, 0px) + 8px)); }
  .card { width:94vw; max-width:460px; background:var(--card); border:1px solid var(--line); border-radius:22px;
          padding:24px 22px; box-shadow:0 14px 50px rgba(0,0,0,.53); }
  h1 { margin:0; font-size:24px; font-size:clamp(20px,5.5vw,26px); display:flex; align-items:center; }
  h1 .ic { margin-right:10px; }
  .sub { color:var(--dim); font-size:13px; margin:6px 0 16px; }
  .prog { height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-bottom:18px; }
  .prog i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#3AA98D,var(--ok)); transition:width .35s; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; padding:13px 14px; background:#0F141A; border:1px solid var(--line);
       border-radius:14px; cursor:pointer; transition:border-color .15s, opacity .15s; user-select:none; }
  li + li { margin-top:8px; }
  li.on { opacity:.5; }
  li.on .t { text-decoration:line-through; color:var(--dim); }
  .box { width:22px; height:22px; border-radius:7px; border:2px solid #35404C; flex:none; position:relative; transition:all .15s; }
  li.on .box { background:var(--ok); border-color:var(--ok); }
  li.on .box::after { content:'✓'; position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center;
                      color:#0B0E12; font-size:14px; font-weight:900; }
  .t { font-size:16px; font-size:clamp(15px,4vw,17px); flex:1; margin-left:12px; }
  .tag { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:2px 8px; }
  #foot { margin-top:14px; min-height:20px; color:var(--ok); font-size:13px; }
  #done { display:none; margin-top:10px; text-align:center; font-size:17px; font-size:clamp(15px,4vw,18px); }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="ic">📝</span>今日待办</h1>
    <div class="sub" id="date"></div>
    <div class="prog"><i id="bar"></i></div>
    <ul id="list"></ul>
    <div id="done">🎉 全部完成！已告知 agent</div>
    <div id="foot"></div>
  </div>
<script>
  var KEY = 'aicast-demo-todo-v1';
  var items = JSON.parse(localStorage.getItem(KEY) || 'null') || [
    { id:'t1', text:'回复产品评审意见', done:false, tag:'工作' },
    { id:'t2', text:'给绿植浇水',       done:false, tag:'家' },
    { id:'t3', text:'散步 30 分钟',     done:false, tag:'健康' },
    { id:'t4', text:'整理 AiCast M4 需求', done:false, tag:'项目' }
  ];
  document.getElementById('date').textContent = new Date().toLocaleDateString('zh-CN', { month:'long', day:'numeric', weekday:'long' });

  function render(){
    var ul = document.getElementById('list'); ul.innerHTML = '';
    items.forEach(function(it){
      var li = document.createElement('li'); if (it.done) li.className = 'on';
      li.innerHTML = '<span class="box"></span><span class="t"></span><span class="tag">' + (it.tag||'') + '</span>';
      li.querySelector('.t').textContent = it.text;
      li.onclick = function(){ toggle(it); };
      ul.appendChild(li);
    });
    var done = items.filter(function(i){return i.done;}).length;
    document.getElementById('bar').style.width = (items.length ? done/items.length*100 : 0) + '%';
    document.getElementById('done').style.display = (items.length && done===items.length) ? 'block' : 'none';
    localStorage.setItem(KEY, JSON.stringify(items));
  }
  function toggle(it){
    it.done = !it.done; render();
    log(it.done ? '已勾选「' + it.text + '」→ 事件已回传' : '已取消「' + it.text + '」');
    AiCast.emit('todo.toggle', { id:it.id, text:it.text, done:it.done });
    if (items.length && items.every(function(i){return i.done;})) AiCast.emit('todo.allDone', { count:items.length });
  }
  function log(t){ document.getElementById('foot').textContent = t; }

  AiCast.onMessage(function(m){
    if (!m) return;
    if (m.action === 'add' && m.text) { items.push({ id:'m'+Date.now(), text:m.text, done:false, tag:m.tag||'新增' }); render(); log('agent 新增了一项：' + m.text); }
    if (m.action === 'clear') { items.forEach(function(i){i.done=false;}); render(); log('agent 重置了勾选'); }
    if (m.text) log('agent：' + m.text);
  });
  render();
</script>
</body>
</html>
