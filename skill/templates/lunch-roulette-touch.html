<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#14100c;
  background:radial-gradient(120% 80% at 50% 0%,#2a1f14 0%,#14100c 60%);
  color:#fff;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{display:-webkit-box;display:flex;flex-direction:column;height:100vh;
  padding:24px 20px 28px;max-width:520px;margin:0 auto}
.head{text-align:center;padding-top:18px}
.head .kicker{font-size:13px;letter-spacing:6px;color:#c9a06a}
.head h1{font-size:34px;margin-top:8px;font-weight:800}
.head h1 span{color:#ffb454}
.slot{flex:1;display:-webkit-box;display:flex;flex-direction:column;
  -webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;
  margin-top:10px}
.card{
  width:100%;background:#1f1811;border:1px solid #3a2c1c;border-radius:28px;
  padding:38px 20px 32px;text-align:center;cursor:pointer;
  box-shadow:0 18px 50px rgba(0,0,0,.55);
}
.emoji{font-size:96px;line-height:1.15;display:block;
  filter:drop-shadow(0 8px 24px rgba(255,180,84,.25))}
.name{font-size:40px;font-weight:800;margin-top:10px;letter-spacing:2px}
.memo{font-size:15px;color:#b9a98f;margin-top:12px;min-height:22px}
.hint{font-size:13px;color:#7d6f5c;margin-top:6px;letter-spacing:1px}
.spin .emoji,.spin .name{opacity:.25}
.btns{display:-webkit-box;display:flex;margin-top:22px}
.btns button{
  -webkit-box-flex:1;flex:1;border:0;border-radius:18px;padding:18px 0;
  font-size:18px;font-weight:700;color:#fff;cursor:pointer;
}
.btns button+button{margin-left:14px}
#go{background:#c0562b;background:linear-gradient(135deg,#e0742f,#b23f1d)}
#lock{background:#2b3a2e;color:#6f7f70;border:1px solid #35483a}
#lock.on{background:#2e7d4f;background:linear-gradient(135deg,#37a065,#1f7a45);color:#fff}
.picked{margin-top:16px;text-align:center;font-size:14px;color:#8aa593;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">AI FACE · 干饭决策</div>
    <h1>中午<span>吃点什么</span>好？</h1>
  </div>
  <div class="slot">
    <div class="card" id="card">
      <span class="emoji" id="emoji">🍽️</span>
      <div class="name" id="name">点我开摇</div>
      <div class="memo" id="memo">摇到心动的就按「就它了」</div>
    </div>
    <div class="hint" id="hint">▲ 卡片点一下 = 摇一摇</div>
  </div>
  <div class="btns">
    <button id="go">摇一摇</button>
    <button id="lock">就它了</button>
  </div>
  <div class="picked" id="picked"></div>
</div>
<script>
var FOODS=[
 {e:"🍔",n:"汉堡",m:"热量炸弹，快乐翻倍"},
 {e:"🍜",n:"拉面",m:"吸溜一口，烦恼没有"},
 {e:"🍣",n:"寿司",m:"清淡精致，一口一个"},
 {e:"🌶️",n:"麻辣烫",m:"自选十样，样样都香"},
 {e:"🍗",n:"黄焖鸡",m:"米饭杀手，汤汁拌饭"},
 {e:"🍲",n:"火锅",m:"一个人的小锅也香"},
 {e:"🍕",n:"披萨",m:"拉丝的那一下最治愈"},
 {e:"🍚",n:"蛋炒饭",m:"粒粒金黄，五分钟上桌"},
 {e:"🥟",n:"饺子",m:"上车饺子下车面，吃"},
 {e:"🥩",n:"烤肉",m:"滋滋冒声才是正餐"},
 {e:"🥗",n:"轻食沙拉",m:"下午要开会？选它"},
 {e:"🍢",n:"关东煮",m:"便利店之光，热乎"},
 {e:"🦞",n:"小龙虾",m:"今天值得庆祝一下"},
 {e:"🍝",n:"意面",m:"番茄还是奶油，到点选"},
 {e:"🥘",n:"咖喱饭",m:"浓稠挂勺，配饭一流"},
 {e:"🍛",n:"盖浇饭",m:"打工人之光，快准稳"},
 {e:"🫠",n:"随便",m:"把选择权交给缘分"},
 {e:"🍦",n:"先吃甜品",m:"反其道而行之"},
 {e:"🥤",n:"奶茶配一切",m:"四分之三糖去冰"},
 {e:"🍤",n:"天妇罗",m:"酥壳掉渣那种"}
];
var card=document.getElementById("card"),
    emoji=document.getElementById("emoji"),nameEl=document.getElementById("name"),
    memo=document.getElementById("memo"),hint=document.getElementById("hint"),
    go=document.getElementById("go"),lock=document.getElementById("lock"),
    picked=document.getElementById("picked");
var spinning=false,timer=null,cur=null,locked=false;
function rand(){return FOODS[Math.floor(Math.random()*FOODS.length)];}
function show(f){emoji.textContent=f.e;nameEl.textContent=f.n;memo.textContent="“"+f.m+"”";cur=f;}
function stop(){
  spinning=false;clearInterval(timer);card.className="card";
  go.textContent="再摇一次";hint.textContent="满意就按「就它了」，不满意继续摇";
  AiCast.emit("lunch.spin",{food:cur.n});
}
function start(){
  if(locked){reset();}
  if(spinning){stop();return;}
  spinning=true;card.className="card spin";hint.textContent="点一下卡片或按钮停";
  timer=setInterval(function(){show(rand());},80);
  setTimeout(function(){if(spinning)stop();},4200);
}
function reset(){
  locked=false;lock.className="";lock.textContent="就它了";picked.textContent="";
}
function pick(){
  if(!cur||spinning)return;
  locked=true;lock.className="on";lock.textContent="已锁定 ✓";
  picked.textContent="午饭就它了："+cur.n+" "+cur.e;
  AiCast.emit("lunch.pick",{food:cur.n,memo:cur.m});
}
card.onclick=start;go.onclick=start;lock.onclick=pick;
</script>
</body>
</html>
