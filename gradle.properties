org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Android 4.4（Dalvik）兼容：R8 full mode 的类合并会把实现 Drawable 的类并成 Object，
# 老 Dalvik 校验时报 "this arg Object not instance of Drawable" 并拒绝整个类（release 包启动即崩）。
# 关掉 full mode 换取旧系统可用；APK 会稍大，换取 4.4 能跑。
android.enableR8.fullMode=false
