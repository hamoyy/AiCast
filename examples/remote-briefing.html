<!doctype html>
<!-- 遥控简报（interactionModel=remote 范式）：自动轮播为主，方向键 ◀▶ 手动翻页，确认键(OK/Enter)暂停/继续。
     回传事件：slide.played {index,title,by:"auto"|"nav"} · remote.pause {paused}
     CSS 兼容基线 Chromium 66（电视 WebView 无法升级）：不用 inset/clamp/min/max/flex-gap，或双声明回退。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; margin:0; }
  body { background:#0B0E12; color:#E6EAF0; font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
         height:100vh; overflow:hidden; }
  .stage { position:relative; height:100vh; }
  .slide { position:absolute; top:0; right:0; bottom:0; left:0; display:none; flex-direction:column; justify-content:center;
           padding:64px; opacity:0; transform:translateY(20px); transition:opacity .45s, transform .45s; }
  .slide.on { display:flex; opacity:1; transform:none; }
  .kicker { font-size:15px; letter-spacing:.24em; color:#4CC2A5; margin-bottom:14px; }
  h2 { font-size:48px; line-height:1.16; font-weight:800; margin-bottom:18px; }
  .body { font-size:22px; color:#AEB7C2; line-height:1.7; max-width:22em; }
  .big { font-size:96px; font-weight:900; color:#4CC2A5; line-height:1; margin-bottom:10px; }
  .hud { position:absolute; left:64px; bottom:26px; right:64px; display:flex; align-items:center; }
  .help { color:#5B6672; font-size:15px; letter-spacing:.06em; }
  #pause { display:none; margin-left:14px; color:#FFD27A; font-size:15px; border:1px solid #4A4433; border-radius:99px; padding:3px 14px; }
  body.paused #pause { display:inline-block; }
  .dots { position:absolute; right:64px; bottom:30px; display:flex; }
  .dot { width:9px; height:9px; border-radius:50%; background:#2A3340; transition:all .3s; }
  .dot + .dot { margin-left:10px; }
  .dot.on { background:#4CC2A5; width:26px; border-radius:5px; }
  .tick { position:absolute; top:0; left:0; height:3px; background:linear-gradient(90deg,#2E6B5C,#4CC2A5); width:0; }
  body.paused .tick { animation-play-state:paused !important; }
  @keyframes run { from{width:0} to{width:100%} }
  .s1 { background:radial-gradient(900px 500px at 80% -10%, #14303B 0%, #0B0E12 55%); }
  .s2 { background:radial-gradient(900px 500px at 15% 110%, #23173B 0%, #0B0E12 55%); }
  .s3 { background:radial-gradient(900px 500px at 90% 110%, #2E2413 0%, #0B0E12 55%); }
</style>
</head>
<body>
  <div class="stage" id="stage"></div>
  <div class="hud">
    <span class="help">◀ ▶ 方向键翻页 · OK 键暂停/继续</span>
    <span id="pause">⏸ 已暂停</span>
  </div>
  <div class="dots" id="dots"></div>
<script>
  var SLIDES = [
    { k:'MORNING · 早安简报', h:'早上好，今天也交给我吧', b:'外面晴 26°C，空气质量优。通勤预计 42 分钟，建议 8:15 出发。', big:'26°' },
    { k:'FOCUS · 工作提醒',   h:'下午 3 点有一场评审',    b:'会前 20 分钟我会提醒你准备材料。剩余 2 条待办已排到下午 1 点。', big:'15:00' },
    { k:'EVENING · 晚间安排', h:'今晚留给生活',           b:'散步提醒 19:30 送达；绿植浇水还没完成，路过阳台时记得。', big:'19:30' }
  ];
  var DUR = 5000, idx = -1, paused = false, timer = null;
  var stage = document.getElementById('stage'), dots = document.getElementById('dots');
  SLIDES.forEach(function(s, i){
    var d = document.createElement('div');
    d.className = 'slide s' + (i+1);
    d.innerHTML = '<div class="tick"></div><div class="kicker"></div><div class="big"></div><h2></h2><div class="body"></div>';
    d.querySelector('.kicker').textContent = s.k;
    d.querySelector('.big').textContent = s.big;
    d.querySelector('h2').textContent = s.h;
    d.querySelector('.body').textContent = s.b;
    stage.appendChild(d);
    var o = document.createElement('div'); o.className = 'dot'; dots.appendChild(o);
  });
  function show(n, by){
    var ss = stage.children, ds = dots.children;
    idx = (n + ss.length) % ss.length;
    for (var i = 0; i < ss.length; i++) { ss[i].classList.toggle('on', i === idx); ds[i].classList.toggle('on', i === idx); }
    var tick = ss[idx].querySelector('.tick');
    tick.style.animation = 'none'; void tick.offsetWidth;
    tick.style.animation = 'run ' + DUR + 'ms linear'; tick.style.animationPlayState = paused ? 'paused' : 'running';
    AiCast.emit('slide.played', { index: idx, title: SLIDES[idx].k, by: by });
  }
  function restart(){ if (timer) clearInterval(timer); timer = setInterval(function(){ if (!paused) show(idx+1, 'auto'); }, DUR); }
  function setPaused(p){
    paused = p; document.body.classList.toggle('paused', p);
    AiCast.emit('remote.pause', { paused: p });
  }
  document.addEventListener('keydown', function(e){
    var k = e.keyCode;
    if (k === 37 || k === 38) { show(idx - 1, 'nav'); restart(); e.preventDefault(); }         // ← / ↑ 上一页
    else if (k === 39 || k === 40) { show(idx + 1, 'nav'); restart(); e.preventDefault(); }     // → / ↓ 下一页
    else if (k === 13 || k === 66) { setPaused(!paused); restart(); e.preventDefault(); }       // OK / Enter 暂停
  });
  show(0, 'auto'); restart();
</script>
</body>
</html>
