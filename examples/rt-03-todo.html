<!doctype html>
<!-- 投屏测试 03：触摸交互 + 事件回传
     测什么：AiCast.emit 回传（可用 $A events 捞到）、AiCast.onMessage 下行、
            localStorage 持久化、CSS 过渡动画、点击热区尺寸（≥44dp）
     回传事件：demo.pack / demo.toggle / demo.allDone
     /message 支持：{"action":"add","text":"..."} 与 {"action":"clear"} -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出差打包清单</title>
<style>
  :root{
    color-scheme: light;
    --bg:#FAF7F2; --card:#FFF; --ink:#231A10; --sub:#8A7B6B;
    --line:#EEE6DA; --brand:#C4622D; --ok:#3F8A5B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;
    padding:16px;
    padding-top:max(16px, calc(env(safe-area-inset-top,0px) + 6px));
    padding-bottom:max(16px, calc(env(safe-area-inset-bottom,0px) + 6px));
  }
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:19px;font-weight:780;letter-spacing:-.01em}
  .sub{font-size:11.5px;color:var(--sub);margin-top:2px}
  .ring{width:52px;height:52px;flex:0 0 52px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .bg{fill:none;stroke:#EEE6DA;stroke-width:5}
  .ring .fg{fill:none;stroke:var(--brand);stroke-width:5;stroke-linecap:round;
            stroke-dasharray:132;stroke-dashoffset:132;transition:stroke-dashoffset .45s cubic-bezier(.3,.9,.3,1)}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

  .grp{font-size:11px;color:var(--sub);letter-spacing:.14em;margin:16px 4px 8px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
        box-shadow:0 4px 14px -10px rgba(35,26,16,.3)}
  .item{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:54px;transition:background .2s}
  .item + .item{border-top:1px solid var(--line)}
  .item:active{background:#FAF3EC}
  .box{width:23px;height:23px;flex:0 0 23px;border-radius:7px;border:2px solid #D9CEBF;
       display:flex;align-items:center;justify-content:center;transition:all .22s}
  .box svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:all .22s}
  .tx{flex:1;font-size:14.5px;line-height:1.35;transition:all .22s}
  .note{font-size:11px;color:var(--sub);margin-top:2px}
  .item.done .box{background:var(--ok);border-color:var(--ok)}
  .item.done .box svg{opacity:1;transform:none}
  .item.done .tx{color:var(--sub);text-decoration:line-through}
  .del{width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:0;background:transparent;
       color:#C9BCAE;font-size:17px;line-height:1}

  .addbar{display:flex;gap:8px;margin-top:14px}
  .addbar input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;
                padding:12px 13px;font-size:14px;color:var(--ink);font-family:inherit;outline:none}
  .addbar input:focus{border-color:var(--brand)}
  .addbar button{border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;
                 padding:0 18px;height:46px;font-family:inherit}
  .addbar button:active{opacity:.82}
  .toast{position:fixed;left:0;right:0;bottom:22px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast span{display:inline-block;background:rgba(35,26,16,.92);color:#fff;font-size:12.5px;
              padding:9px 16px;border-radius:99px}
  .toast.on{opacity:1}
</style>
</head>
<body>
  <div class="top">
    <div><h1>出差打包清单</h1><div class="sub" id="cnt">0 / 0 已完成</div></div>
    <div class="ring">
      <svg viewBox="0 0 52 52"><circle class="bg" cx="26" cy="26" r="21"/><circle class="fg" id="fg" cx="26" cy="26" r="21"/></svg>
      <b id="pct">0%</b>
    </div>
  </div>

  <div id="wrap"></div>

  <div class="addbar">
    <input id="ipt" placeholder="加一件要带的东西…" autocomplete="off">
    <button id="add">添加</button>
  </div>

  <div class="toast" id="toast"><span id="toastTx"></span></div>

<script>
  var KEY = 'rt-demo-pack-v1';
  var DEFAULTS = [
    {id:1, g:'证件 / 电子', t:'身份证 + 护照', n:'放随身夹层，别托运', d:false},
    {id:2, g:'证件 / 电子', t:'充电器 + 充电宝', n:'20000mAh 以内可上机', d:false},
    {id:3, g:'证件 / 电子', t:'公司笔记本', n:'含电源适配器', d:true},
    {id:4, g:'衣物', t:'换洗衣物 ×3', n:'按 3 天 2 夜估', d:false},
    {id:5, g:'衣物', t:'正装一套', n:'客户见面日穿', d:false},
    {id:6, g:'其他', t:'常用药', n:'肠胃药 + 创可贴', d:false}
  ];
  var items = [];
  try { items = JSON.parse(localStorage.getItem(KEY)) || DEFAULTS.slice(); }
  catch (e) { items = DEFAULTS.slice(); }
  if (!items.length) items = DEFAULTS.slice();

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }
  function emit(n, d){ if (typeof AiCast !== 'undefined' && AiCast.emit) AiCast.emit(n, d || {}); }

  var wrap = document.getElementById('wrap');
  function render(){
    var done = items.filter(function(i){return i.d;}).length;
    document.getElementById('cnt').textContent = done + ' / ' + items.length + ' 已完成';
    var p = items.length ? Math.round(done / items.length * 100) : 0;
    document.getElementById('pct').textContent = p + '%';
    document.getElementById('fg').style.strokeDashoffset = 132 - 132 * p / 100;

    // 按 g 字段聚合成若干组，每组一个 .list 卡片
    var html = '', last = null, open = false;
    items.forEach(function(it){
      if (it.g !== last) {
        if (open) html += '</div>';           // 收掉上一组的卡片容器
        html += '<div class="grp">' + esc(it.g) + '</div><div class="list">';
        last = it.g; open = true;
      }
      html +=
        '<div class="item' + (it.d ? ' done' : '') + '" data-id="' + it.id + '">' +
          '<div class="box"><svg viewBox="0 0 14 14"><path d="M2 7.4 L5.4 11 L12 3.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
          '<div class="tx">' + esc(it.t) + (it.n ? '<div class="note">' + esc(it.n) + '</div>' : '') + '</div>' +
          '<button class="del" data-del="' + it.id + '">×</button>' +
        '</div>';
    });
    if (open) html += '</div>';
    wrap.innerHTML = html;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function toast(tx){
    document.getElementById('toastTx').textContent = tx;
    var t = document.getElementById('toast'); t.classList.add('on');
    setTimeout(function(){ t.classList.remove('on'); }, 1600);
  }

  wrap.addEventListener('click', function(e){
    var del = e.target.closest('[data-del]');
    if (del){ var id = +del.getAttribute('data-del');
      items = items.filter(function(i){ return i.id !== id; }); save(); render(); return; }
    var el = e.target.closest('.item');
    if (!el) return;
    var it = items.filter(function(i){ return i.id === +el.getAttribute('data-id'); })[0];
    if (!it) return;
    it.d = !it.d; save(); render();
    emit('demo.toggle', { id:it.id, text:it.t, done:it.d });
    var done = items.filter(function(i){return i.d;}).length;
    emit('demo.pack', { done:done, total:items.length, pct:Math.round(done/items.length*100) });
    if (items.length && items.every(function(i){return i.d;})) emit('demo.allDone', { count:items.length });
  });

  function doAdd(){
    var ipt = document.getElementById('ipt');
    var v = (ipt.value || '').trim();
    if (!v) return;
    var maxId = items.reduce(function(a,i){ return Math.max(a, i.id); }, 0);
    items.push({ id:maxId + 1, g:'其他', t:v, n:'', d:false });
    ipt.value = ''; save(); render();
    emit('demo.add', { text:v });
    toast('已添加「' + v + '」');
  }
  document.getElementById('add').addEventListener('click', doAdd);
  document.getElementById('ipt').addEventListener('keydown', function(e){ if (e.key === 'Enter') doAdd(); });

  if (typeof AiCast !== 'undefined' && AiCast.onMessage) {
    AiCast.onMessage(function(m){
      if (!m) return;
      if (m.action === 'add' && m.text) {
        var maxId = items.reduce(function(a,i){ return Math.max(a, i.id); }, 0);
        items.push({ id:maxId + 1, g:m.group || '其他', t:String(m.text), n:m.note || '', d:false });
        save(); render(); emit('demo.add', { text:m.text, from:'message' });
      } else if (m.action === 'clear') {
        items.forEach(function(i){ i.d = false; }); save(); render();
      }
    });
  }

  render();
  emit('demo.ready', { count:items.length });
</script>
</body>
</html>
