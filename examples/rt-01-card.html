<!doctype html>
<!-- 投屏测试 01：静态排版 / 浅色主题
     测什么：中文字体栈、vw 自适应、safe-area 避让、圆角卡片+阴影、CSS 渐变、现代 grid/flex -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日概览</title>
<style>
  :root{
    color-scheme: light;
    --bg:#F2F4F8; --card:#FFF; --ink:#0F172A; --sub:#64748B;
    --line:#E6E9F0; --brand:#3355E0; --good:#0FA36B; --warn:#F59F0B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:14px;
    padding-top:max(14px, calc(env(safe-area-inset-top,0px) + 6px));
    padding-bottom:max(14px, calc(env(safe-area-inset-bottom,0px) + 6px));
  }
  .head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 14px}
  .hi{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .date{font-size:12px;color:var(--sub);letter-spacing:.04em}

  .hero{
    position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;color:#fff;
    background:linear-gradient(135deg,#3355E0 0%,#5B7BFA 48%,#7AA0FF 100%);
    box-shadow:0 10px 26px -12px rgba(51,85,224,.55);
  }
  .hero:after{
    content:'';position:absolute;right:-46px;top:-56px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 70%);
  }
  .t1{font-size:13px;opacity:.82;letter-spacing:.14em}
  .temp{display:flex;align-items:flex-start;margin:2px 0 12px}
  .temp b{font-size:64px;font-weight:800;line-height:.94;letter-spacing:-.04em}
  .temp span{font-size:16px;opacity:.85;margin-top:8px;margin-left:3px}
  .wx{font-size:14px;opacity:.9}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .m{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:9px 10px}
  .m i{display:block;font-size:10.5px;opacity:.82;font-style:normal;letter-spacing:.06em}
  .m b{display:block;font-size:16px;font-weight:700;margin-top:3px}

  .sec{font-size:12px;color:var(--sub);letter-spacing:.14em;margin:20px 4px 9px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
        box-shadow:0 4px 14px -10px rgba(15,23,42,.28)}
  .row{display:flex;gap:12px;padding:14px 15px}
  .row + .row{border-top:1px solid var(--line)}
  .bar{width:3px;border-radius:3px;flex:0 0 3px;background:var(--brand)}
  .bar.g{background:var(--good)} .bar.w{background:var(--warn)}
  .tm{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .ti{font-size:15px;font-weight:650;margin:2px 0 3px}
  .td{font-size:12.5px;color:var(--sub);line-height:1.5}
  .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;background:#EEF1F8;color:var(--brand);margin-top:6px}

  .quote{margin-top:18px;padding:16px 18px;border-radius:18px;background:#0F172A;color:#E7ECF7}
  .quote p{font-size:14.5px;line-height:1.62}
  .quote cite{display:block;margin-top:9px;font-size:11px;opacity:.62;font-style:normal;letter-spacing:.08em}
</style>
</head>
<body>
  <div class="head">
    <div class="hi">下午好，王先生</div>
    <div class="date" id="d"></div>
  </div>

  <div class="hero">
    <div class="t1">当前天气 · 上海</div>
    <div class="temp"><b>27</b><span>°C</span></div>
    <div class="wx">多云转晴 · 体感 29° · 东南风 2 级</div>
    <div class="metrics">
      <div class="m"><i>空气</i><b>优 32</b></div>
      <div class="m"><i>湿度</i><b>58%</b></div>
      <div class="m"><i>紫外</i><b>中等</b></div>
    </div>
  </div>

  <div class="sec">今日日程</div>
  <div class="card">
    <div class="row"><div class="bar"></div><div>
      <div class="tm">14:00 — 15:00</div><div class="ti">协议层评审</div>
      <div class="td">三楼会议室 · 6 人 · 材料已同步</div><span class="tag">已准备</span></div></div>
    <div class="row"><div class="bar g"></div><div>
      <div class="tm">16:30 — 17:00</div><div class="ti">一对一沟通</div>
      <div class="td">线上 · 议题已收集 3 条</div></div></div>
    <div class="row"><div class="bar w"></div><div>
      <div class="tm">19:20 — 19:50</div><div class="ti">设备固件灰度</div>
      <div class="td">需到场确认 5 台样机状态</div><span class="tag">需处理</span></div></div>
  </div>

  <div class="quote">
    <p>“把复杂留给自己，把简单交出去。判断一个设计好不好，看它能不能让人少想一步。”</p>
    <cite>— 今日寄语</cite>
  </div>

<script>
  var n = new Date(), w = ['日','一','二','三','四','五','六'][n.getDay()];
  document.getElementById('d').textContent =
    n.getFullYear() + '.' + ('0'+(n.getMonth()+1)).slice(-2) + '.' + ('0'+n.getDate()).slice(-2) + ' 周' + w;
</script>
</body>
</html>
