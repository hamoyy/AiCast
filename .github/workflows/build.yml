name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # 支持在 Actions 页面手动点一下就跑
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 拉全量历史+标签：GitCode 镜像同步需要完整提交记录和 tags
          fetch-depth: 0

      # 代码镜像到 GitCode（国内访问 GitHub 慢，镜像仓库给国内用户看代码/下源码）
      # push main 或打 tag 时自动推过去，平时无需登录 GitCode 打理
      #
      # 注意：main 与 tag 若在同一分钟内触发，两次 job 会并发 force push 同一个 ref，
      # GitCode 会以「cannot lock ref … is at X but expected Y」拒绝掉后到的那次
      # （实测 2026-11-10 发 v0.2.0 时踩到，main 那次整体失败）。所以重试 + 不让它挡住发布。
      - name: 同步代码镜像到 GitCode
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          MIRROR_URL="https://hamoyy:${GITCODE_TOKEN}@gitcode.com/hamoyy/AiCast.git"
          for i in 1 2 3; do
            if git push --force "$MIRROR_URL" "HEAD:refs/heads/main" && git push --force "$MIRROR_URL" --tags; then
              echo "镜像同步完成"; exit 0
            fi
            echo "::warning::镜像同步第 ${i} 次失败，3 秒后重试"
            sleep 3
          done
          echo "::warning::GitCode 镜像同步失败；镜像落后不影响 GitHub 发布，下次 push 会自动补上"

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 别用默认的 packages（里面含已被移除的 'tools' 包，会直接失败）；
          # 其余需要的 platform/build-tools 由 AGP 自动补装，licenses 该动作已接受
          packages: 'platform-tools'

      - name: 缓存 Gradle（第二次起会快很多）
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 用仓库 secret 里的密钥签，保证 CI 出的包和本地出的包签名一致、能互相覆盖安装。
      # 没配 secret（比如 fork 过来的 PR）就临时生成一个，保证构建不失败。
      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.AICAST_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo ">> 使用仓库密钥签名（与本地一致，可直接覆盖安装）"
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::未配置 AICAST_KEYSTORE_BASE64，本次用临时签名，装到已有设备需先卸载"
          fi

      - name: 编译 debug APK（日常推送 / PR）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      # 打 tag 时出 release 包：R8 裁剪过、体积小，安装包文件名统一成 aicast-<tag>.apk，
      # 这样官网下载按钮（GitHub Releases 直链）的地址是固定的、可预测的。
      - name: 编译 release APK（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/aicast-${GITHUB_REF_NAME}.apk"
          # 固定文件名：官网用 releases/latest/download/aicast.apk 指过来，
          # 以后每发一版都不用改官网代码
          cp "dist/aicast-${GITHUB_REF_NAME}.apk" dist/aicast.apk
          ls -l dist

      # 应用内更新的清单：版本号 / 大小 / sha256 / 下载地址。
      # 校验 tag 与 versionName 一致 —— 不一致会让「用户看到 0.2.0、装的却是 0.1.0」，
      # 而更新逻辑是按 versionCode 判断的，这种错会静默误导。
      - name: 生成 update.json（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -e
          VNAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VCODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VNAME" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 versionName $VNAME 不一致（更新判断依赖它）"
            exit 1
          fi
          MINSUP=$(sed -n 's/^minSupportedVersionCode=\([0-9]*\).*/\1/p' app/update-policy.properties | head -1)
          APK="dist/aicast-${GITHUB_REF_NAME}.apk"
          python3 - "$APK" "$GITHUB_REF_NAME" "$VCODE" "$VNAME" "${MINSUP:-$VCODE}" > dist/update.json <<'PY'
          import hashlib, json, os, sys, datetime
          apk, tag, vcode, vname, minsup = sys.argv[1:6]
          h = hashlib.sha256()
          with open(apk, 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''):
                  h.update(chunk)
          doc = {
              "versionCode": int(vcode),
              "versionName": vname,
              "minSupportedVersionCode": int(minsup),
              "apkUrl": f"https://gitcode.com/hamoyy/AiCast/releases/download/{tag}/aicast.apk",
              "apkUrlFallback": f"https://github.com/hamoyy/AiCast/releases/download/{tag}/aicast.apk",
              "size": os.path.getsize(apk),
              "sha256": h.hexdigest(),
              "notes": os.environ.get("RELEASE_NOTES", "").strip(),
              "pubDate": datetime.date.today().isoformat(),
          }
          print(json.dumps(doc, ensure_ascii=False, indent=2))
          PY
          cat dist/update.json

      - name: 上传 debug APK（在 Actions 页面可下载）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: aicast-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 release APK（在 Actions 页面可下载）
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: aicast-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 打 tag 时自动发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # 连 update.json 一起发：应用内更新先读官网那份，官网没跟上时回落到这里
          files: dist/*
          generate_release_notes: true

      # 把 APK 同步发到 GitCode 的 Release（GitCode 镜像只同步代码不同步附件）
      # 流程：创建 Release -> 逐个文件申请预签名上传地址 -> PUT 上传
      - name: 同步 APK 到 GitCode Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          API="https://api.gitcode.com/api/v5/repos/hamoyy/AiCast"
          # Release 已存在就跳过创建（幂等）
          EXIST=$(curl -s -o /dev/null -w '%{http_code}' "$API/releases/$TAG")
          if [ "$EXIST" != "200" ]; then
            curl -s -X POST "$API/releases" -H "Content-Type: application/json" \
              -d "{\"access_token\":\"$GITCODE_TOKEN\",\"tag_name\":\"$TAG\",\"name\":\"AiCast $TAG\",\"body\":\"安装包在下方 Assets 里（国内下载用）\"}"
            echo
          fi
          for f in dist/*.apk dist/update.json; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            curl -s "$API/releases/$TAG/upload_url?access_token=$GITCODE_TOKEN&file_name=$fname" > /tmp/gc_up.json
            URL=$(jq -r '.url // empty' /tmp/gc_up.json)
            if [ -z "$URL" ]; then echo "拿不到上传地址：$(cat /tmp/gc_up.json)"; exit 1; fi
            # 把接口返回的 headers 展开成 curl 参数（GitCode 用华为 OBS 预签名上传）
            ARGS=()
            while IFS= read -r line; do ARGS+=("$line"); done < <(jq -r '.headers // {} | to_entries[] | "-H", "\(.key): \(.value)"' /tmp/gc_up.json)
            echo "上传 $fname"
            curl -s -m 600 -X PUT "$URL" "${ARGS[@]}" --data-binary "@$f" -w " HTTP:%{http_code}\n"
          done
          echo "GitCode 下载链接："
          curl -s "$API/releases/$TAG" | jq -r '.assets[] | select(.type != "source") | " - \(.name)  \(.browser_download_url)"'
