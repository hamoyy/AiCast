<!doctype html>
<!-- 投屏测试 05：外链图片 + 网格布局
     测什么：设备端能否直连 CDN 取真图（info.internet.state=online 才有意义）、
             object-fit 裁切、CSS grid masonry 式错落布局、图片加载失败降级占位 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>今日图集</title>
<style>
  :root{ color-scheme: light; --ink:#14181F; --sub:#7A828E; --line:#ECEFF3; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;background:#fff;color:var(--ink);
    font-family:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:16px;
    padding-top:max(16px, calc(env(safe-area-inset-top,0px) + 6px));
    padding-bottom:max(20px, calc(env(safe-area-inset-bottom,0px) + 6px));
  }
  .top{margin-bottom:15px}
  h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .sub{font-size:12px;color:var(--sub);margin-top:4px;display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:#0FA36B;box-shadow:0 0 0 3px rgba(15,163,107,.16)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{position:relative;border-radius:16px;overflow:hidden;background:#F3F5F8;border:1px solid var(--line)}
  .card.tall{grid-row:span 2}
  .ph{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
  .ph.on{opacity:1}
  .card:after{content:'';position:absolute;left:0;right:0;bottom:0;height:56%;
              background:linear-gradient(transparent,rgba(0,0,0,.66));pointer-events:none}
  .meta{position:absolute;left:11px;right:11px;bottom:10px;z-index:2;color:#fff}
  .meta b{display:block;font-size:13px;font-weight:700;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .meta i{font-style:normal;font-size:10.5px;opacity:.82;letter-spacing:.04em}
  .sk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(100deg,#F3F5F8 30%,#E9EDF2 50%,#F3F5F8 70%);
      background-size:220% 100%;animation:sk 1.3s infinite;color:#AFB7C2;font-size:11px}
  @keyframes sk{from{background-position:120% 0}to{background-position:-20% 0}}
  .sk.off{display:none}
  .fail{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
        gap:5px;color:#A8AFBA;font-size:11px;background:#F7F8FA}
  .fail span{font-size:20px}
  .fail.on{display:flex}

  .foot{margin-top:16px;font-size:11px;color:var(--sub);line-height:1.7;
        border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
  <div class="top">
    <h1>今日图集</h1>
    <div class="sub"><span class="dot" id="net"></span><span id="netTx">正在加载远端图片…</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot">
    图片直连公开图源（picsum.photos），无本地资源。若设备离线或图源被墙，
    卡片会走右下角「加载失败」占位而不是白块 —— 这也是本次要验的行为。
  </div>

<script>
  var SHOTS = [
    {t:'晨雾中的山脊', i:'清晨 6:12 · 焦距 35mm',      tall:true,  u:'https://picsum.photos/id/1018/600/900'},
    {t:'城市天际线',   i:'正午 12:40 · 焦距 24mm',     tall:false, u:'https://picsum.photos/id/1015/600/450'},
    {t:'海边公路',     i:'黄昏 18:05 · 焦距 50mm',     tall:false, u:'https://picsum.photos/id/1016/600/450'},
    {t:'林间小径',     i:'午后 14:20 · 焦距 85mm',     tall:false, u:'https://picsum.photos/id/1044/600/450'},
    {t:'湖面倒影',     i:'日落 17:48 · 焦距 35mm',     tall:false, u:'https://picsum.photos/id/1051/600/450'}
  ];
  var grid = document.getElementById('grid'), loaded = 0, failed = 0;

  SHOTS.forEach(function(s, k){
    var d = document.createElement('div');
    d.className = 'card' + (s.tall ? ' tall' : '');
    if (s.tall) d.style.minHeight = '248px'; else d.style.minHeight = '119px';
    d.innerHTML =
      '<div class="sk">加载中…</div>' +
      '<div class="fail"><span>⚠</span>图片加载失败</div>' +
      '<img class="ph" alt="' + s.t.replace(/"/g,'') + '">' +
      '<div class="meta"><b>' + s.t + '</b><i>' + s.i + '</i></div>';
    grid.appendChild(d);

    var img = d.querySelector('img'), sk = d.querySelector('.sk'), fail = d.querySelector('.fail');
    var timer = setTimeout(function(){ img.src = s.u + '?retry=' + k; }, k * 220);
    img.onload = function(){
      clearTimeout(timer); loaded++; sk.classList.add('off'); img.classList.add('on'); done();
    };
    img.onerror = function(){
      failed++; sk.classList.add('off'); fail.classList.add('on'); done();
    };
  });

  function done(){
    if (loaded + failed < SHOTS.length) return;
    var el = document.getElementById('netTx');
    if (failed === 0) el.textContent = '远端图片 ' + loaded + '/' + SHOTS.length + ' 全部加载成功';
    else el.textContent = '成功 ' + loaded + ' · 失败 ' + failed + '（降级占位已生效）';
    document.getElementById('net').style.background = failed ? '#F59F0B' : '#0FA36B';
    if (typeof AiCast !== 'undefined' && AiCast.emit) AiCast.emit('demo.gallery', { loaded:loaded, failed:failed });
  }
</script>
</body>
</html>
