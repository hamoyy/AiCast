name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # 支持在 Actions 页面手动点一下就跑
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 别用默认的 packages（里面含已被移除的 'tools' 包，会直接失败）；
          # 其余需要的 platform/build-tools 由 AGP 自动补装，licenses 该动作已接受
          packages: 'platform-tools'

      - name: 缓存 Gradle（第二次起会快很多）
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 用仓库 secret 里的密钥签，保证 CI 出的包和本地出的包签名一致、能互相覆盖安装。
      # 没配 secret（比如 fork 过来的 PR）就临时生成一个，保证构建不失败。
      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.AICAST_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo ">> 使用仓库密钥签名（与本地一致，可直接覆盖安装）"
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::未配置 AICAST_KEYSTORE_BASE64，本次用临时签名，装到已有设备需先卸载"
          fi

      - name: 编译 debug APK（日常推送 / PR）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      # 打 tag 时出 release 包：R8 裁剪过、体积小，安装包文件名统一成 aicast-<tag>.apk，
      # 这样官网下载按钮（GitHub Releases 直链）的地址是固定的、可预测的。
      - name: 编译 release APK（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/aicast-${GITHUB_REF_NAME}.apk"
          # 固定文件名：官网用 releases/latest/download/aicast.apk 指过来，
          # 以后每发一版都不用改官网代码
          cp "dist/aicast-${GITHUB_REF_NAME}.apk" dist/aicast.apk
          ls -l dist

      - name: 上传 debug APK（在 Actions 页面可下载）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: aicast-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 release APK（在 Actions 页面可下载）
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: aicast-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 打 tag 时自动发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
